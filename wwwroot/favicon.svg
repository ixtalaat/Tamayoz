<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b6b60" />
      <stop offset="100%" stop-color="#0c2d27" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe188" />
      <stop offset="100%" stop-color="#f1b84b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#f1b84b" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)" />

  <!-- Graduation Cap / Academic Symbol -->
  <!-- Cap Top Diamond -->
  <polygon points="32,16 52,25 32,34 12,25" fill="url(#goldGrad)" />
  
  <!-- Cap Base / Skullcap -->
  <path d="M20,29.5 L20,38 C20,43 44,43 44,38 L44,29.5 C39.5,32.5 24.5,32.5 20,29.5 Z" fill="#ffffff" opacity="0.95" />

  <!-- Tassel -->
  <path d="M48,27 L50,37 L47,38 L47,43 L51,43 L51,38 L48,37" fill="#f1b84b" />

  <!-- Golden Sparkle Dot -->
  <circle cx="32" cy="49" r="3.5" fill="url(#goldGrad)" />
  <path d="M32,43.5 L33.2,47.5 L37.5,49 L33.2,50.5 L32,54.5 L30.8,50.5 L26.5,49 L30.8,47.5 Z" fill="#ffffff" />
</svg>